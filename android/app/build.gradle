plugins {
    id 'com.android.application'
}

android {
    namespace 'com.signabridge.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.signabridge.app"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // ConstraintLayout 2.2.1 — fixes manifest merger bug in 2.1.4 with AGP 8.7
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // CameraX 1.4.0
    def camerax_version = "1.4.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime:2.8.6"

    // MediaPipe Tasks Vision
    implementation 'com.google.mediapipe:tasks-vision:1.1.1'

    // TensorFlow Lite
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'

    // Unit Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

        // Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.8.4'
    implementation 'androidx.navigation:navigation-ui:2.8.4'

    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // ViewModel & LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'androidx.core:core-splashscreen:1.0.1'
}